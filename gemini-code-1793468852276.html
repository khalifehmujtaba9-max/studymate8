<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate - منصة الصف الثامن</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .bg-custom-navy { background-color: #0b0c5d; }
    .text-custom-navy { color: #0b0c5d; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Passcode Protected Screen -->
  <div id="passcode-page" class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 text-center space-y-6">
      <div class="w-16 h-16 bg-blue-100 text-[#0b0c5d] rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
        <i class="fas fa-lock"></i>
      </div>
      <div>
        <h2 class="text-2xl font-extrabold text-slate-800">موقع محمي بكلمة سر</h2>
        <p class="text-xs text-slate-500 mt-1">أدخل رمز الأمان الخاص بالصف الثامن لمتابعة الدخول</p>
      </div>
      <form onsubmit="verifyPasscode(event)" class="space-y-4">
        <input type="password" id="site-passcode" placeholder="أدخل رمز الأمان (Passcode)" required class="w-full px-4 py-3 rounded-xl border text-center text-lg tracking-widest focus:ring-2 focus:ring-[#0b0c5d] outline-none">
        <button type="submit" class="w-full bg-[#0b0c5d] text-white font-bold py-3 rounded-xl shadow-lg hover:bg-blue-900 transition">فتح المنصة</button>
      </form>
    </div>
  </div>

  <!-- Login Page -->
  <div id="login-page" class="hidden min-h-screen flex items-center justify-center p-4 bg-slate-100">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
      <div class="bg-custom-navy p-8 text-center text-white relative">
        <div class="w-20 h-20 bg-white rounded-2xl mx-auto mb-4 p-3 shadow-md flex items-center justify-center">
          <svg class="w-full h-full text-[#0b0c5d]" viewBox="0 0 512 512" fill="none"><path d="M 160,140 C 70,140 70,372 160,372 C 230,372 245,300 256,256 C 267,300 282,372 352,372 C 442,372 442,140 352,140 C 282,140 267,212 256,256 C 245,212 230,140 160,140 Z" fill="currentColor"/></svg>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight">StudyMate</h1>
        <p class="text-blue-200 text-sm mt-1 font-medium">منصة رفقا الصف الثامن 🎓</p>
      </div>

      <div class="p-8 space-y-6">
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">اسم المستخدم (Username)</label>
            <input type="text" id="username" placeholder="ادخل اسم المستخدم الخص بك" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#0b0c5d] outline-none text-slate-800 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">كلمة المرور (Password)</label>
            <input type="password" id="password" placeholder="ادخل كلمة المرور" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#0b0c5d] outline-none text-slate-800 text-sm">
          </div>
          <button type="submit" class="w-full bg-[#0b0c5d] hover:bg-blue-900 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg text-sm">
            تسجيل الدخول <i class="fas fa-arrow-left mr-2"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Main App Screen -->
  <div id="main-app" class="hidden min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-custom-navy text-white shadow-md">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3 space-x-reverse">
          <div class="w-10 h-10 bg-white rounded-xl p-1.5 shadow flex items-center justify-center">
            <svg class="w-full h-full text-[#0b0c5d]" viewBox="0 0 512 512" fill="none"><path d="M 160,140 C 70,140 70,372 160,372 C 230,372 245,300 256,256 C 267,300 282,372 352,372 C 442,372 442,140 352,140 C 282,140 267,212 256,256 C 245,212 230,140 160,140 Z" fill="currentColor"/></svg>
          </div>
          <div>
            <h1 class="text-xl font-black">StudyMate</h1>
            <p class="text-xs text-blue-200">منصة الصف الثامن</p>
          </div>
        </div>
        <div class="flex items-center space-x-4 space-x-reverse">
          <span id="user-badge" class="px-3 py-1 bg-white/10 rounded-full text-xs font-bold"></span>
          <button onclick="handleLogout()" class="text-xs bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg font-bold transition">
            خروج <i class="fas fa-sign-out-alt mr-1"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Content Sections -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
      <!-- Tabs -->
      <div class="flex overflow-x-auto space-x-2 space-x-reverse border-b border-slate-200 pb-2">
        <button onclick="switchTab('homework')" id="tab-homework" class="tab-btn px-4 py-2 rounded-xl font-bold text-sm bg-custom-navy text-white">
          📚 المفكرة والفروض
        </button>
        <button onclick="switchTab('missed')" id="tab-missed" class="tab-btn px-4 py-2 rounded-xl font-bold text-sm bg-white text-slate-600 hover:bg-slate-200">
          📝 شو نسيت أكتب؟
        </button>
        <button onclick="switchTab('cards')" id="tab-cards" class="tab-btn px-4 py-2 rounded-xl font-bold text-sm bg-white text-slate-600 hover:bg-slate-200">
          📑 بطاقات تدريبية وملفات
        </button>
        <button onclick="switchTab('chat')" id="tab-chat" class="tab-btn px-4 py-2 rounded-xl font-bold text-sm bg-white text-slate-600 hover:bg-slate-200">
          💬 الدردشة الصوتية
        </button>
      </div>

      <!-- Section: Homework -->
      <section id="sec-homework" class="space-y-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold mb-3 text-slate-800">إضافة فرض أو مهمة جديدة للمفكرة</h2>
          <form onsubmit="addHomework(event)" class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <select id="hw-subject" class="p-2.5 rounded-xl border text-sm font-bold bg-slate-50">
              <option value="اللغة العربية">اللغة العربية</option>
              <option value="English">English</option>
              <option value="Mathematics">Mathematics</option>
              <option value="الفيزياء">الفيزياء</option>
              <option value="الكيمياء">الكيمياء</option>
              <option value="علوم الحياة">علوم الحياة</option>
              <option value="التاريخ">التاريخ</option>
              <option value="الجغرافيا">الجغرافيا</option>
              <option value="التربية">التربية</option>
              <option value="اللغة الفارسية">اللغة الفارسية</option>
            </select>
            <input type="text" id="hw-title" placeholder="عنوان الفرض أو الملاحظة" required class="p-2.5 rounded-xl border text-sm md:col-span-2">
            <button type="submit" class="bg-custom-navy text-white px-4 py-2.5 rounded-xl font-bold text-sm hover:bg-blue-900">إضافة للمفكرة</button>
          </form>
        </div>
        <div id="homework-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

      <!-- Section: Missed -->
      <section id="sec-missed" class="hidden space-y-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold mb-3 text-slate-800">اطلب مساعدة من الرفاق (شو نسيت أكتب؟) 🤝</h2>
          <form onsubmit="addMissedNote(event)" class="space-y-3">
            <textarea id="missed-text" placeholder="اكتب شو نسيت تكتب بالصف..." required class="w-full p-3 border rounded-xl text-sm"></textarea>
            <div class="flex items-center gap-3">
              <input type="file" id="missed-file" class="text-xs bg-slate-50 p-2 border rounded-xl flex-grow">
              <button type="submit" class="bg-custom-navy text-white px-5 py-2.5 rounded-xl font-bold text-sm">نشر الطلب</button>
            </div>
          </form>
        </div>
        <div id="missed-list" class="space-y-4"></div>
      </section>

      <!-- Section: Files & Cards -->
      <section id="sec-cards" class="hidden space-y-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold mb-3 text-slate-800">رفع ورقة عمل أو بطاقات تدريبية 📂</h2>
          <form onsubmit="uploadFile(event)" class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <select id="file-subject" class="p-2.5 rounded-xl border text-sm font-bold bg-slate-50">
              <option value="اللغة العربية">اللغة العربية</option>
              <option value="English">English</option>
              <option value="Mathematics">Mathematics</option>
              <option value="الفيزياء">الفيزياء</option>
              <option value="الكيمياء">الكيمياء</option>
              <option value="علوم الحياة">علوم الحياة</option>
              <option value="التاريخ">التاريخ</option>
              <option value="الجغرافيا">الجغرافيا</option>
              <option value="التربية">التربية</option>
              <option value="اللغة الفارسية">اللغة الفارسية</option>
            </select>
            <input type="text" id="file-title" placeholder="اسم البطاقات أو الملخص" required class="p-2.5 rounded-xl border text-sm">
            <input type="file" id="file-input" required class="p-2 rounded-xl border text-xs bg-slate-50">
            <button type="submit" class="bg-custom-navy text-white px-4 py-2.5 rounded-xl font-bold text-sm">رفع ومشاركة</button>
          </form>
        </div>
        <div id="files-list" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
      </section>

      <!-- Section: Chat -->
      <section id="sec-chat" class="hidden space-y-4">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[500px]">
          <div class="p-4 border-b bg-slate-50 rounded-t-2xl font-bold text-slate-700">شات الرفاق والتسجيلات الصوتية والملفات 🎙️📎</div>
          <div id="chat-messages" class="flex-grow p-4 overflow-y-auto space-y-3 custom-scroll"></div>
          <div class="p-3 border-t bg-slate-50 flex items-center space-x-2 space-x-reverse rounded-b-2xl">
            <label for="chat-file" class="cursor-pointer bg-slate-200 hover:bg-slate-300 text-slate-700 p-2.5 rounded-xl text-sm"><i class="fas fa-paperclip"></i></label>
            <input type="file" id="chat-file" class="hidden" onchange="handleChatFileUpload(event)">
            <input type="text" id="chat-text" placeholder="اكتب رسالة للشباب..." class="flex-grow p-2.5 border rounded-xl text-sm outline-none">
            <button onclick="sendChatMessage()" class="bg-custom-navy text-white px-4 py-2.5 rounded-xl text-sm font-bold"><i class="fas fa-paper-plane"></i></button>
            <button id="record-btn" onclick="toggleRecord()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2.5 rounded-xl text-sm font-bold"><i class="fas fa-microphone"></i></button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SITE_PASSCODE = "grade82026";
    let currentUser = null;
    let mediaRecorder, audioChunks = [];

    const USERS = {
      mojtaba: { name: 'مجتبى', pass: 'pass123' },
      ali_h: { name: 'علي حـ', pass: 'pass123' },
      ali_z: { name: 'علي ز.', pass: 'pass123' },
      mahdi: { name: 'مهدي', pass: 'pass123' },
      houssein: { name: 'حسين', pass: 'pass123' },
      hadi: { name: 'هادي', pass: 'pass123' },
      hassan: { name: 'حسن', pass: 'pass123' },
      fatima: { name: 'فاطمة', pass: 'pass123' },
      zohra: { name: 'زهراء', pass: 'pass123' },
      mariam: { name: 'مريم', pass: 'pass123' },
      sara: { name: 'سارة', pass: 'pass123' }
    };

    function verifyPasscode(e) {
      e.preventDefault();
      const code = document.getElementById('site-passcode').value.trim();
      if (code === SITE_PASSCODE) {
        document.getElementById('passcode-page').classList.add('hidden');
        document.getElementById('login-page').classList.remove('hidden');
      } else {
        alert('رمز أمان الصف غير صحيح!');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();

      if (USERS[u] && USERS[u].pass === p) {
        currentUser = USERS[u];
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        document.getElementById('user-badge').innerText = currentUser.name;
        renderAll();
      } else {
        alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
      }
    }

    function handleLogout() {
      currentUser = null;
      document.getElementById('login-page').classList.remove('hidden');
      document.getElementById('main-app').classList.add('hidden');
    }

    function switchTab(tab) {
      ['homework', 'missed', 'cards', 'chat'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "tab-btn px-4 py-2 rounded-xl font-bold text-sm bg-white text-slate-600 hover:bg-slate-200";
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "tab-btn px-4 py-2 rounded-xl font-bold text-sm bg-custom-navy text-white";
    }

    // Homework Management
    function addHomework(e) {
      e.preventDefault();
      const list = JSON.parse(localStorage.getItem('sm_hw') || '[]');
      list.push({
        subject: document.getElementById('hw-subject').value,
        title: document.getElementById('hw-title').value,
        by: currentUser.name,
        date: new Date().toLocaleDateString('ar-EG')
      });
      localStorage.setItem('sm_hw', JSON.stringify(list));
      document.getElementById('hw-title').value = '';
      renderHomework();
    }

    function renderHomework() {
      const list = JSON.parse(localStorage.getItem('sm_hw') || '[]');
      const container = document.getElementById('homework-list');
      container.innerHTML = list.map(item => `
        <div class="bg-white p-4 rounded-xl border-r-4 border-custom-navy shadow-sm border border-slate-200">
          <span class="text-xs font-bold px-2 py-0.5 rounded bg-blue-50 text-custom-navy">${item.subject}</span>
          <h3 class="font-bold text-slate-800 text-base mt-2">${item.title}</h3>
          <p class="text-xs text-slate-400 mt-2">بواسطة: ${item.by} • ${item.date}</p>
        </div>
      `).join('') || '<p class="text-xs text-slate-400">لا يوجد فروض أو ملاحظات بعد.</p>';
    }

    // Missed Notes Management
    function addMissedNote(e) {
      e.preventDefault();
      const fileInput = document.getElementById('missed-file');
      const file = fileInput.files[0];
      const text = document.getElementById('missed-text').value;

      const save = (fileData = null, fileName = null) => {
        const list = JSON.parse(localStorage.getItem('sm_missed') || '[]');
        list.push({
          id: Date.now(),
          text: text,
          fileData: fileData,
          fileName: fileName,
          by: currentUser.name,
          replies: []
        });
        localStorage.setItem('sm_missed', JSON.stringify(list));
        document.getElementById('missed-text').value = '';
        fileInput.value = '';
        renderMissed();
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = evt => save(evt.target.result, file.name);
        reader.readAsDataURL(file);
      } else {
        save();
      }
    }

    function addReply(id, text) {
      if (!text) return;
      const list = JSON.parse(localStorage.getItem('sm_missed') || '[]');
      const item = list.find(x => x.id === id);
      if (item) {
        item.replies.push({ by: currentUser.name, text: text });
        localStorage.setItem('sm_missed', JSON.stringify(list));
        renderMissed();
      }
    }

    function renderMissed() {
      const list = JSON.parse(localStorage.getItem('sm_missed') || '[]');
      const container = document.getElementById('missed-list');
      container.innerHTML = list.map(item => `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
          <div class="flex justify-between font-bold text-sm">
            <span class="text-custom-navy">🙋‍♂️ ${item.by}</span>
            <span class="text-xs text-slate-400">طلب مساعدة</span>
          </div>
          <p class="text-slate-700 text-sm bg-slate-50 p-3 rounded-lg border">${item.text}</p>
          ${item.fileData ? `<a href="${item.fileData}" download="${item.fileName}" class="inline-block text-xs text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg border font-bold">تنزيل المرفق: ${item.fileName} <i class="fas fa-download"></i></a>` : ''}
          <div class="space-y-2 pl-4 border-r-2 border-slate-200">
            ${item.replies.map(r => `
              <div class="text-xs bg-blue-50 p-2 rounded-lg">
                <span class="font-bold text-custom-navy">${r.by}:</span> ${r.text}
              </div>
            `).join('')}
          </div>
          <div class="flex gap-2">
            <input type="text" id="reply-input-${item.id}" placeholder="اكتب رداً..." class="flex-grow p-1.5 border rounded-lg text-xs">
            <button onclick="addReply(${item.id}, document.getElementById('reply-input-${item.id}').value)" class="bg-custom-navy text-white text-xs px-3 py-1.5 rounded-lg font-bold">مساعدة</button>
          </div>
        </div>
      `).join('');
    }

    // Files Upload Management
    function uploadFile(e) {
      e.preventDefault();
      const fileInput = document.getElementById('file-input');
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const list = JSON.parse(localStorage.getItem('sm_files') || '[]');
        list.push({
          subject: document.getElementById('file-subject').value,
          title: document.getElementById('file-title').value,
          fileName: file.name,
          data: evt.target.result,
          by: currentUser.name
        });
        localStorage.setItem('sm_files', JSON.stringify(list));
        document.getElementById('file-title').value = '';
        fileInput.value = '';
        renderFiles();
      };
      reader.readAsDataURL(file);
    }

    function renderFiles() {
      const list = JSON.parse(localStorage.getItem('sm_files') || '[]');
      const container = document.getElementById('files-list');
      container.innerHTML = list.map(item => `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
          <div>
            <span class="text-xs font-bold px-2 py-0.5 rounded bg-blue-50 text-custom-navy">${item.subject}</span>
            <h4 class="font-bold text-slate-800 text-sm mt-2">${item.title}</h4>
            <p class="text-xs text-slate-400 mt-1">${item.fileName} • بواسطة: ${item.by}</p>
          </div>
          <a href="${item.data}" download="${item.fileName}" class="mt-4 text-center bg-slate-100 hover:bg-slate-200 text-custom-navy text-xs font-bold py-2 rounded-lg transition">تحميل الملف <i class="fas fa-download mr-1"></i></a>
        </div>
      `).join('') || '<p class="text-xs text-slate-400 col-span-3">لا يوجد ملفات مرفوعة حالياً.</p>';
    }

    // Chat Management
    function sendChatMessage(audioData = null, fileData = null, fileName = null) {
      const text = document.getElementById('chat-text').value;
      if (!text && !audioData && !fileData) return;

      const list = JSON.parse(localStorage.getItem('sm_chat') || '[]');
      list.push({
        by: currentUser.name,
        text: text,
        audio: audioData,
        fileData: fileData,
        fileName: fileName,
        time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
      });
      localStorage.setItem('sm_chat', JSON.stringify(list));
      document.getElementById('chat-text').value = '';
      renderChat();
    }

    function handleChatFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => sendChatMessage(null, evt.target.result, file.name);
      reader.readAsDataURL(file);
    }

    function toggleRecord() {
      const btn = document.getElementById('record-btn');
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        btn.classList.replace('bg-slate-700', 'bg-red-500');
      } else {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/mp3' });
            const reader = new FileReader();
            reader.onloadend = () => sendChatMessage(reader.result);
            reader.readAsDataURL(blob);
          };
          mediaRecorder.start();
          btn.classList.replace('bg-red-500', 'bg-slate-700');
        }).catch(() => alert('يرجى السماح بالوصول للمايكروفون لتسجيل الفويس!'));
      }
    }

    function renderChat() {
      const list = JSON.parse(localStorage.getItem('sm_chat') || '[]');
      const container = document.getElementById('chat-messages');
      container.innerHTML = list.map(m => `
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 max-w-sm">
          <div class="flex justify-between text-xs font-bold text-custom-navy mb-1">
            <span>${m.by}</span>
            <span class="text-slate-400 font-normal">${m.time}</span>
          </div>
          ${m.text ? `<p class="text-sm text-slate-700">${m.text}</p>` : ''}
          ${m.audio ? `<audio controls src="${m.audio}" class="w-full mt-2 h-8"></audio>` : ''}
          ${m.fileData ? `<a href="${m.fileData}" download="${m.fileName}" class="inline-block mt-2 text-xs text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg font-bold">تنزيل الملف: ${m.fileName} <i class="fas fa-download"></i></a>` : ''}
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    function renderAll() {
      renderHomework();
      renderMissed();
      renderFiles();
      renderChat();
    }
  </script>
</body>
</html>
